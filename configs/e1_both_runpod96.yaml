# E1-both on the RunPod RTX Pro 6000 96 GB: same parameters as e1_both.yaml, both models resident, 16 prompts per
# generator call, 8 concurrent captions (OLLAMA_PAR=8). Launch: CFG=configs/e1_both_runpod96.yaml bash scripts/runpod_launch.sh smoke|core
run_name: e1_both
arm: E1-both
mode: single_pass
steps: 100
trajectories: {first: 0, count: 100}
temperature: 0.9
prompt_clip: {enabled: true, max_tokens: 77}
generator: {backend: hunyuan, model: Tencent-Hunyuan/HunyuanDiT-v1.2-Diffusers, revision: 5e96094e0ad19e7f475de8711f03634ca0ccc40c,
            variant: null, dtype: float16, num_inference_steps: 25, guidance_scale: null, height: null, width: null, resize_to: 512,
            batch: 16, cpu_offload: false, release_mode: delete, compile: true}
captioner: {model: "qwen2.5vl:7b", digest_prefix: "5ced39dfa4ba", parallel: 8, unload_after_pass: false}
