# E3-2 pilot (SPEC2 §4 E3, amended 2026-10-28): rewrite loop ("Rewrite this story, same length."), Hintze seeds 0–19 x 100 steps,
# claude-sonnet-5-5 over the Messages API, default sampling (D16: T is probed and rejected), effort low, 8 concurrent trajectories. Step 0 copied from runs/e3_1_sonnet, so run E3-1 first.
run_name: e3_2_sonnet
arm: E3-2
loop: rewrite
steps: 100
trajectories: {first: 0, count: 20}
temperature: 0.9
step0: {source: e3_1_sonnet}
model: {backend: anthropic, model: claude-sonnet-5-5, parallel: 8, effort: low, max_tokens_story: 4000, max_tokens_summary: 1000, timeout_s: 180, retries: 8}
