# E3-DS (predictions.md "E3-DS", 2026-11-05; Brad's go-ahead 2026-11-05): the E3-D theme-bottleneck loop on claude-sonnet-5-5. Compress asks
# for a one-sentence theme (<= 25 words, no character or place names); expand unchanged; Hintze seeds 0–19 x 100 steps; step 0 copied from
# e3_1_sonnet (same model, same expand instruction), as e3_d_haiku copied from e3_1_haiku. Default sampling (temperature rejected by the API), effort low.
run_name: e3_d_sonnet
arm: E3-D
loop: compress_expand
steps: 100
trajectories: {first: 0, count: 20}
temperature: 0.9
step0: {source: e3_1_sonnet}
summary_word_limit: 25
instructions:
  compress: "State the theme of this story in one sentence of 25 words or fewer. Do not mention any character's name or any place name. Return only the sentence. Do not explain."
model: {backend: anthropic, model: claude-sonnet-5-5, parallel: 8, effort: low, max_tokens_story: 4000, max_tokens_summary: 1000, timeout_s: 180, retries: 8}
