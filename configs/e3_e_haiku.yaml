# E3-E (predictions.md "E3-E essay-loop pilot", 2026-11-03): compress–expand loop on encyclopaedia topics, essay -> 50-word summary -> essay,
# claude-haiku-5-5, default sampling (D16), effort low. Seeds: data/essay_seeds/vital3_100.pkl (100 random Wikipedia Vital Articles level 3
# topics, lead two sentences at a pinned revision; see vital3_100.json). Pilot = seeds 0–19 x 100 steps, 8 concurrent trajectories.
run_name: e3_e_haiku
arm: E3-E
loop: compress_expand
steps: 100
trajectories: {first: 0, count: 20}
temperature: 0.9
summary_word_limit: 50
seeds: {file: data/essay_seeds/vital3_100.pkl}
instructions:
  expand: "Write an essay of about 500 words on the following topic. Return only the essay. Do not explain."
  compress: "Summarize this essay. The summary must be 50 words or fewer. Do not exceed the limit. Return only the summary. Do not explain."
model: {backend: anthropic, model: claude-haiku-5-5, parallel: 8, effort: low, max_tokens_story: 4000, max_tokens_summary: 1000, timeout_s: 180, retries: 8}
