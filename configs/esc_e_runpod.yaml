# ESC-E (predictions.md "ESC", approved by Brad 2026-11-15): escape from T3's eye attractor. 100 chains of the fast pair, each
# starting from a T3 eye state written as step 0 by scripts/seed_states.py (17 entrants, ~6 states each, rng 20261115);
# steps 1-400 are new, sdxl_seed = 20261115 + chain*10000 + step. Models, revisions and sampling exactly as configs/fast_1000_runpod.yaml (D21).
# The seed prompts are never used (every chain's step 0 exists before the run).
#   laptop: .venv/bin/python scripts/seed_states.py --source fast_1000 --target esc_e --labels reports/fast_1000_labels.npz --attractor 1 --chains 100 --rng 20261115
#           scripts/runpod_sync.sh push && scripts/runpod_sync.sh push-run esc_e
#   pod:    MODELS=fast bash scripts/runpod_setup.sh;  CFG=configs/esc_e_runpod.yaml bash scripts/runpod_launch.sh core
run_name: esc_e
arm: ESC-E
mode: single_pass
steps: 401
trajectories: {first: 0, count: 100}
temperature: 0.9
generator:
  backend: sdxl
  model: stabilityai/sdxl-turbo
  revision: 71153311d3dbb46851df1931d3ca6e939de83304   # HF snapshot 2026-11-12
  variant: fp16
  dtype: float16
  num_inference_steps: 1
  guidance_scale: 0.0
  height: 512
  width: 512
  resize_to: null
  batch: 20
  cpu_offload: false
  release_mode: delete
captioner:
  backend: hf_moondream
  model: vikhyatk/moondream2
  revision: "2025-06-21"
  dtype: bfloat16
  digest_prefix: null
  parallel: 1
  unload_after_pass: false
seeds:
  sdxl_base_seed: 20261115
