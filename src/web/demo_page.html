<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop Grid</title>
<style>
:root{--bg:#0b0b0d;--ink:#e8e6e1;--muted:#9a978f;--line:#2a2a2e;--accent:#d9b45a;--panel:rgba(14,14,17,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#grid{display:grid;gap:3px}
.cell{position:relative;overflow:hidden;background:#151518;aspect-ratio:1}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease}
.cell img.back{opacity:0}
.cell img:not([src]){visibility:hidden}
.cell.blur img{filter:blur(22px) saturate(.6)}
.cell .tag{position:absolute;top:4px;left:5px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:0 4px;border-radius:3px;opacity:.75}
.cell .filt{position:absolute;top:4px;right:5px;font-size:10px;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px;display:none}
.cell.blur .filt{display:block}
.cell .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:var(--capsize,11px);line-height:1.25;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.78));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
body.nocap .cap,body.nocap .tag{display:none}
.cell.flash::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--accent);animation:fl 1.4s ease-out forwards;pointer-events:none}
@keyframes fl{from{opacity:1}to{opacity:0}}
#bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);z-index:5;transition:opacity .3s;opacity:0}
body:hover #bar,#bar:focus-within,body.pin #bar{opacity:1}
#bar button,#bar select{background:#1d1d22;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:inherit;cursor:pointer}
#bar button.on{border-color:var(--accent);color:var(--accent)}
#bar label{color:var(--muted)}
#status{color:var(--muted);margin-left:auto;white-space:nowrap}
#msg{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:var(--panel);padding:4px 10px;border-radius:4px;color:var(--muted);display:none;z-index:6}
</style></head>
<body>
<div id="bar">
  <span><b>Loop grid</b></span>
  <span><label>mode</label> <button id="mLive">live</button><button id="mReplay">replay</button></span>
  <span><label>grid</label> <button data-side="3">3×3</button><button data-side="4">4×4</button><button data-side="5">5×5</button></span>
  <span id="replayCtl"><label>run</label> <select id="run"></select>
    <label>from step</label> <input id="from" type="number" min="0" value="50" style="width:60px;background:#1d1d22;color:var(--ink);border:1px solid var(--line);border-radius:4px">
    <label>pace</label> <input id="speed" type="range" min="0.3" max="6" step="0.1" value="1.5"> <span id="speedv"></span></span>
  <span id="liveCtl"><button id="stop">stop live run</button></span>
  <span><button id="caps">captions</button></span>
  <span id="status"></span>
</div>
<div id="wrap"><div id="grid"></div></div>
<div id="msg"></div>
<script>
const Q = new URLSearchParams(location.search);
const S = {mode: Q.get('mode') || 'live', side: +(Q.get('side') || 3), run: Q.get('run') || null, from: +(Q.get('from') || 50),
           pace: +(Q.get('pace') || 1.5), caps: Q.get('caps') !== '0'};
const $ = s => document.querySelector(s);
const j = async (u, o) => { const r = await fetch(u, o); if (!r.ok) throw new Error(await r.text()); return r.json(); };
let cells = [], shown = {}, queue = [], timer = null, poller = null, frames = {}, lastArrival = null, emaGap = 1.5, tickN = 0, replayLast = {};

function msg(t, ms = 3000) { const m = $('#msg'); m.textContent = t; m.style.display = t ? 'block' : 'none'; if (t && ms) setTimeout(() => m.style.display = 'none', ms); }
function saveUrl() { const u = new URLSearchParams({mode: S.mode, side: S.side, pace: S.pace, caps: S.caps ? 1 : 0}); if (S.mode === 'replay') { u.set('run', S.run || ''); u.set('from', S.from); } history.replaceState(null, '', '?' + u); }

function layout() {
  const n = S.side, g = $('#grid'), W = innerWidth - 6, H = innerHeight - 6, size = Math.floor(Math.min(W, H));
  g.style.width = g.style.height = size + 'px'; g.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  document.documentElement.style.setProperty('--capsize', Math.max(9, Math.min(13, size / n / 18)) + 'px');
  if (cells.length !== n * n) {
    g.innerHTML = ''; cells = []; shown = {};
    for (let t = 0; t < n * n; t++) {
      const c = document.createElement('div'); c.className = 'cell';
      c.innerHTML = '<img class="front" alt=""><img class="back" alt=""><span class="tag"></span><span class="filt">filtered</span><div class="cap"></div>';
      g.appendChild(c); cells.push(c);
    }
  }
}
addEventListener('resize', layout);

function show(run, c) {               // cross-fade cell c.traj to (run, c.step); preload first so the swap never flashes empty
  const el = cells[c.traj]; if (!el) return;
  shown[c.traj] = c.step;
  const img = new Image(); img.src = `/api/run/${run}/image/${c.traj}/${c.step}`;
  img.onload = () => {
    const front = el.querySelector('img.front'), back = el.querySelector('img.back');
    back.src = img.src; back.classList.remove('back'); back.classList.add('front'); front.classList.remove('front'); front.classList.add('back');
    el.classList.toggle('blur', !!c.nsfw);
    el.querySelector('.tag').textContent = `#${c.traj} · step ${c.step}`;
    el.querySelector('.cap').textContent = c.nsfw ? '' : c.caption;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  };
}

// ---------------- live: poll every second, queue new completed steps, reveal one at a time at the observed arrival rate
async function livePoll() {
  let L; try { L = await j('/api/demo/live'); } catch (e) { return; }
  if (L.starting) { status(`starting a ${S.side}×${S.side} run…`); }
  if (!L.run) { status('no live run yet: pick a grid size'); return; }
  if (S.run !== L.run) { S.run = L.run; if (L.side !== S.side) { S.side = L.side; markSide(); } layout(); queue = []; }
  let st; try { st = await j(`/api/demo/state/${L.run}?n=${S.side * S.side}`); } catch (e) { return; }
  for (const c of st) {
    if (c.step < 0 || c.nsfw === null) continue;                      // not scored yet: wait for the filter
    if (shown[c.traj] === undefined) { show(L.run, c); continue; }    // first fill: no pacing
    if (c.step > shown[c.traj] && !queue.some(q => q.traj === c.traj && q.step === c.step)) {
      queue = queue.filter(q => q.traj !== c.traj); queue.push(c);
      const now = performance.now(); if (lastArrival) emaGap = 0.8 * emaGap + 0.2 * Math.min(6, (now - lastArrival) / 1000); lastArrival = now;
    }
  }
  const rate = L.s_per_traj_step ? `${L.s_per_traj_step}s/chain-step` : '';
  status(`${L.alive ? 'live' : 'stopped'} · ${L.run} · ${(L.phase || '').replace('vikhyatk/', '')} ${rate} · queue ${queue.length}`);
}
function liveTick() {
  if (queue.length) { show(S.run, queue.shift()); }
  clearTimeout(timer); timer = setTimeout(liveTick, 1000 * Math.max(0.6, Math.min(3, queue.length > 3 ? emaGap * 0.6 : emaGap)));
}

// ---------------- replay: advance the cell that is furthest behind, one reveal every 1/pace seconds
async function fetchFrames(start) {
  const n = S.side * S.side, r = await j(`/api/demo/frames/${S.run}?n=${n}&start=${start}&count=12`);
  replayLast = r.last; for (const [t, fs] of Object.entries(r.frames)) for (const f of fs) frames[`${t}/${f.step}`] = f;
}
async function replayStart() {
  frames = {}; shown = {}; tickN = 0; layout(); await fetchFrames(S.from); replayTick();
}
async function replayTick() {
  clearTimeout(timer); const n = S.side * S.side; tickN++;
  const empty = []; for (let t = 0; t < n; t++) if (shown[t] === undefined) empty.push(t);
  if (empty.length) {                                   // fill cells still waiting for their first (scored) frame
    for (const t of empty) { const f = frames[`${t}/${Math.min(S.from, replayLast[t] ?? S.from)}`]; if (f && f.nsfw !== null) show(S.run, f); }
    if (tickN % 3 === 0) fetchFrames(S.from).catch(() => {});
  }
  const todo = []; for (let t = 0; t < n; t++) if (shown[t] !== undefined && shown[t] < (replayLast[t] ?? -1)) todo.push(t);
  if (todo.length) {
    todo.sort((a, b) => shown[a] - shown[b] || ((a * 7 + tickN) % n) - ((b * 7 + tickN) % n));
    const t = todo[0], f = frames[`${t}/${shown[t] + 1}`];
    if (f && f.nsfw !== null) show(S.run, f);
    const lo = Math.min(...todo.map(x => shown[x]));
    if (!frames[`${t}/${shown[t] + 4}`] || !f || f.nsfw === null) fetchFrames(lo + 1).catch(() => {});
    status(`replay · ${S.run} · step ${lo}${replayLast[0] !== undefined ? ' / ' + replayLast[0] : ''}`);
  } else if (!empty.length) status(`replay · ${S.run} · finished`);
  timer = setTimeout(replayTick, 1000 / S.pace);
}

// ---------------- controls
function status(t) { $('#status').textContent = t; }
function markSide() { document.querySelectorAll('[data-side]').forEach(b => b.classList.toggle('on', +b.dataset.side === S.side)); }
function markMode() {
  $('#mLive').classList.toggle('on', S.mode === 'live'); $('#mReplay').classList.toggle('on', S.mode === 'replay');
  $('#replayCtl').style.display = S.mode === 'replay' ? '' : 'none'; $('#liveCtl').style.display = S.mode === 'live' ? '' : 'none';
}
async function start() {
  clearTimeout(timer); clearInterval(poller); queue = []; markMode(); markSide(); layout(); saveUrl();
  if (S.mode === 'live') { S.run = null; await livePoll(); poller = setInterval(livePoll, 1000); liveTick(); }
  else {
    const rs = await j('/api/demo/runs'); const sel = $('#run');
    sel.innerHTML = rs.map(r => `<option ${r.run === S.run ? 'selected' : ''}>${r.run}</option>`).join('');
    if (!S.run || !rs.some(r => r.run === S.run)) S.run = (rs.find(r => r.run === 'fast_100') || rs[0] || {}).run;
    sel.value = S.run; if (S.run) replayStart();
  }
}
$('#mLive').onclick = () => { S.mode = 'live'; start(); };
$('#mReplay').onclick = () => { S.mode = 'replay'; start(); };
document.querySelectorAll('[data-side]').forEach(b => b.onclick = async () => {
  const side = +b.dataset.side;
  if (S.mode === 'live') {
    if (!confirm(`Start a new live ${side}×${side} run? The current live run stops (its images are kept).`)) return;
    try { await j(`/api/demo/live/${side}`, {method: 'POST'}); msg(`starting ${side}×${side}: stopping the old run and loading the models takes ~1 min`, 8000); }
    catch (e) { msg('start failed: ' + e.message, 6000); return; }
    S.side = side; cells = []; layout(); markSide(); saveUrl();
  } else { S.side = side; cells = []; start(); }
});
$('#stop').onclick = async () => { if (confirm('Stop the live run?')) { await j('/api/demo/stop', {method: 'POST'}); msg('stop requested'); } };
$('#run').onchange = e => { S.run = e.target.value; start(); };
$('#from').value = S.from; $('#from').onchange = e => { S.from = Math.max(0, +e.target.value || 0); start(); };
$('#speed').value = S.pace; $('#speedv').textContent = S.pace + '/s';
$('#speed').oninput = e => { S.pace = +e.target.value; $('#speedv').textContent = S.pace.toFixed(1) + '/s'; saveUrl(); };
$('#caps').onclick = () => { S.caps = !S.caps; document.body.classList.toggle('nocap', !S.caps); $('#caps').classList.toggle('on', S.caps); saveUrl(); };
document.body.classList.toggle('nocap', !S.caps); $('#caps').classList.toggle('on', S.caps);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'c') $('#caps').click();
  if (e.key === 'p') document.body.classList.toggle('pin');
  if (e.key === 'r') $('#mReplay').click();
  if (e.key === 'l') $('#mLive').click();
});
start();
</script>
</body></html>
